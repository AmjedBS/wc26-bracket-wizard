<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup 2026 Interactive Bracket Predictor</title>
    <style>
        :root {
            --bg-primary: #0a0f1d;
            --bg-secondary: #131c33;
            --bg-card: #1c294a;
            --accent-green: #00ff87;
            --accent-blue: #00d2ff;
            --accent-purple: #7928ca;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --border-color: #2b3d66;
            --gold: #ffd700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow-x: hidden;
            padding-bottom: 60px;
        }

        header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, #060a15 100%);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            position: relative;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(to right, var(--accent-green), var(--accent-blue));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Tabs / Progress Wizard */
        .wizard-progress {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .step-pill {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .step-pill.active {
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        .step-pill.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Views management */
        .view-panel {
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        .view-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Phase 1: Group Stage UI */
        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .group-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .group-card:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 210, 255, 0.4);
        }

        .group-card h3 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            color: var(--accent-blue);
        }

        .row-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .pos-label {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
        }

        .pos-label.p1 { border-color: var(--gold); color: var(--gold); }
        .pos-label.p2 { border-color: #c0c0c0; color: #c0c0c0; }
        .pos-label.p3 { border-color: #cd7f32; color: #cd7f32; }
        .pos-label.p4 { border-color: #9aa4b2; color: #9aa4b2; }

        .select-wrapper {
            flex-grow: 1;
        }

        .team-preview {
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 22px;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 6px 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .team-preview.hidden {
            display: none;
        }

        .team-preview img,
        .team-flag {
            width: 16px;
            height: 12px;
            border-radius: 2px;
            object-fit: cover;
            flex: 0 0 auto;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
        }

        .team-preview .team-name-text,
        .bracket-team .team-name {
            color: var(--text-main);
            font-weight: 600;
        }

        .team-preview code {
            color: var(--accent-blue);
            background: transparent;
            font-size: 0.8rem;
        }

        .third-place-inline {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
        }

        .third-place-inline input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-green);
            cursor: pointer;
        }

        .third-place-inline label {
            cursor: pointer;
            color: var(--text-main);
            font-size: 0.92rem;
        }

        .bracket-team-content {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .bracket-team .team-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .limit-flash {
            animation: limitFlash 0.35s ease;
        }

        @keyframes limitFlash {
            0% { transform: translateX(0); box-shadow: 0 0 0 rgba(255, 90, 90, 0); }
            25% { transform: translateX(-2px); box-shadow: 0 0 0 3px rgba(255, 90, 90, 0.15); }
            50% { transform: translateX(2px); }
            75% { transform: translateX(-1px); }
            100% { transform: translateX(0); box-shadow: 0 0 0 rgba(255, 90, 90, 0); }
        }

        select {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--accent-green);
        }

        /* Action Footer Buttons */
        .action-container {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .btn-action {
            background: linear-gradient(90deg, var(--accent-green), var(--accent-blue));
            color: #000;
            border: none;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 255, 135, 0.3);
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 255, 135, 0.5);
        }

        .btn-action:disabled {
            background: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Phase 2: Knockout Bracket View */
        .bracket-outer {
            overflow-x: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .bracket-scroll-container {
            display: flex;
            gap: 40px;
            min-width: max-content;
            padding: 20px;
            align-items: center;
        }

        .bracket-round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 100%;
            gap: 20px;
        }

        .round-title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 5px;
        }

        /* Match structures */
        .match-pair {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            width: 200px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: border-color 0.2s;
        }

        .match-pair:hover {
            border-color: var(--accent-blue);
        }

        .bracket-team {
            padding: 12px 15px;
            background: var(--bg-card);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
            user-select: none;
            gap: 10px;
        }

        .bracket-team:first-child {
            border-bottom: 1px solid var(--border-color);
        }

        .bracket-team:hover {
            background: #24355e;
            padding-left: 20px;
        }

        .bracket-team.winner {
            background: linear-gradient(90deg, rgba(0, 255, 135, 0.15) 0%, var(--bg-card) 100%);
            color: var(--accent-green);
            font-weight: 700;
        }

        .bracket-team.winner::after {
            content: "➔";
            color: var(--accent-green);
            font-size: 0.9rem;
            animation: bounceRight 0.5s infinite alternate;
        }

        @keyframes bounceRight {
            from { transform: translateX(0); }
            to { transform: translateX(3px); }
        }

        .bracket-team.loser {
            opacity: 0.4;
        }

        .bracket-team.tbd {
            color: var(--text-muted);
            font-style: italic;
            cursor: not-allowed;
        }
        .bracket-team.tbd:hover {
            background: var(--bg-card);
            padding-left: 15px;
        }

        .bracket-team-content {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .bracket-team .team-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Special display elements for Finals */
        .finals-block {
            display: flex;
            flex-direction: column;
            gap: 40px;
            justify-content: center;
            align-items: center;
        }

        .podium-box {
            background: linear-gradient(145deg, #1c294a 0%, #0d162d 100%);
            border: 2px solid var(--gold);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            width: 280px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            animation: pulseGold 2s infinite;
            display: none;
        }

        @keyframes pulseGold {
            0% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); }
            50% { box-shadow: 0 0 35px rgba(255, 215, 0, 0.4); }
            100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); }
        }

        .podium-box h2 {
            color: var(--gold);
            font-size: 1.1rem;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .podium-box .champion-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            display: none;
        }

        /* Responsiveness tweak for the bracket view scroll notification */
        .scroll-notice {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: none;
        }

        @media (max-width: 1024px) {
            .scroll-notice { display: block; }
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <header>
        <h1>WORLD CUP 2026</h1>
        <p>Interactive Bracket & Knockout Predictor</p>
    </header>

    <div class="container">
        <!-- Wizard Progress Bar -->
        <div class="wizard-progress">
            <div class="step-pill active" id="pill-group" onclick="switchView('group')">1. Group Stages</div>
            <div class="step-pill disabled" id="pill-knockout" onclick="goToKnockoutsPhase()">2. Knockouts Bracket</div>
        </div>

        <!-- PHASE 1 PANEL: GROUPS -->
        <div id="panel-group" class="view-panel active">
            <div class="groups-grid" id="groups-container"></div>
            <div class="action-container">
                <button class="btn-action" id="btn-to-knockouts" onclick="goToKnockoutsPhase()" disabled>Advance to Knockouts Bracket</button>
            </div>
        </div>

        <!-- PHASE 2 PANEL: KNOCKOUTS -->
        <div id="panel-knockout" class="view-panel">
            <div class="scroll-notice">◀ Swipe or scroll horizontally to explore the full bracket columns ▶</div>
            
            <div class="bracket-outer">
                <!-- Champion Showcase Podium -->
                <div style="display: flex; justify-content: center; width: 100%;">
                    <div class="podium-box" id="champion-podium">
                        <h2>WORLD CHAMPION</h2>
                        <div class="champion-name" id="champion-display">???</div>
                    </div>
                </div>

                <div class="bracket-scroll-container">
                    <!-- R32 -->
                    <div class="bracket-round">
                        <div class="round-title">Round of 32</div>
                        <div id="r32-slots"></div>
                    </div>

                    <!-- R16 -->
                    <div class="bracket-round">
                        <div class="round-title">Round of 16</div>
                        <div id="r16-slots"></div>
                    </div>

                    <!-- QF -->
                    <div class="bracket-round">
                        <div class="round-title">Quarter-Finals</div>
                        <div id="qf-slots"></div>
                    </div>

                    <!-- SF -->
                    <div class="bracket-round">
                        <div class="round-title">Semi-Finals</div>
                        <div id="sf-slots"></div>
                    </div>

                    <!-- FINALS/3RD COLOUMN -->
                    <div class="bracket-round finals-block">
                        <div>
                            <div class="round-title" style="border-color: var(--gold)">World Cup Final</div>
                            <div class="match-pair" id="match-final"></div>
                        </div>
                        <div>
                            <div class="round-title">Third-Place Playoff</div>
                            <div class="match-pair" id="match-thirdplace"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Real baseline World Cup 2026 groups configuration (12 groups A to L)
        const initialGroupsData = {
            'A': ['Mexico (MEX)', 'South Africa (RSA)', 'South Korea (KOR)', 'Czechia (CZE)'],
            'B': ['Canada (CAN)', 'Bosnia (BIH)', 'Qatar (QAT)', 'Switzerland (SUI)'],
            'C': ['Brazil (BRA)', 'Morocco (MAR)', 'Haiti (HAI)', 'Scotland (SCO)'],
            'D': ['United States (USA)', 'Paraguay (PAR)', 'Australia (AUS)', 'Turkey (TUR)'],
            'E': ['Germany (GER)', 'Curaçao (CUW)', 'Ivory Coast (CIV)', 'Ecuador (ECU)'],
            'F': ['Netherlands (NED)', 'Japan (JPN)', 'Sweden (SWE)', 'Tunisia (TUN)'],
            'G': ['Belgium (BEL)', 'Egypt (EGY)', 'Iran (IRN)', 'New Zealand (NZL)'],
            'H': ['Spain (ESP)', 'Cape Verde (CPV)', 'Saudi Arabia (KSA)', 'Uruguay (URU)'],
            'I': ['France (FRA)', 'Senegal (SEN)', 'Iraq (IRQ)', 'Norway (NOR)'],
            'J': ['Argentina (ARG)', 'Algeria (ALG)', 'Austria (AUT)', 'Jordan (JOR)'],
            'K': ['Portugal (POR)', 'DR Congo (COD)', 'Uzbekistan (UZB)', 'Colombia (COL)'],
            'L': ['England (ENG)', 'Croatia (CRO)', 'Ghana (GHA)', 'Panama (PAN)']
        };

        // Complete accurate structural array tracking user placement inputs
        let groupSelections = {};

        // Global State Tree preserving Bracket selections mapping
        // Structure preserves match indexes and explicit selections
        let bracketState = {
            r32: Array(16).fill(null),
            r16: Array(8).fill(null),
            qf: Array(4).fill(null),
            sf: Array(2).fill(null),
            final: null,
            thirdplace: null,
            champion: null,
            thirdPlaceWinner: null
        };

        const appStorageKey = 'wc26-world-cup-state';
        let savedThirdPlacePromotions = {};
        let currentViewName = 'group';

        // Initialize App UI elements
        document.addEventListener("DOMContentLoaded", () => {
            loadAppState();
            renderGroupStageSelectors();
            restoreAppStateToUI();
        });

        const localFlagCodeMap = {
            'Mexico (MEX)': 'mx',
            'South Africa (RSA)': 'za',
            'South Korea (KOR)': 'kr',
            'Czechia (CZE)': 'cz',
            'Canada (CAN)': 'ca',
            'Bosnia (BIH)': 'ba',
            'Qatar (QAT)': 'qa',
            'Switzerland (SUI)': 'ch',
            'Brazil (BRA)': 'br',
            'Morocco (MAR)': 'ma',
            'Haiti (HAI)': 'ht',
            'Scotland (SCO)': 'gb-sct',
            'United States (USA)': 'us',
            'Paraguay (PAR)': 'py',
            'Australia (AUS)': 'au',
            'Turkey (TUR)': 'tr',
            'Germany (GER)': 'de',
            'Curaçao (CUW)': 'cw',
            'Ivory Coast (CIV)': 'ci',
            'Ecuador (ECU)': 'ec',
            'Netherlands (NED)': 'nl',
            'Japan (JPN)': 'jp',
            'Sweden (SWE)': 'se',
            'Tunisia (TUN)': 'tn',
            'Belgium (BEL)': 'be',
            'Egypt (EGY)': 'eg',
            'Iran (IRN)': 'ir',
            'New Zealand (NZL)': 'nz',
            'Spain (ESP)': 'es',
            'Cape Verde (CPV)': 'cv',
            'Saudi Arabia (KSA)': 'sa',
            'Uruguay (URU)': 'uy',
            'France (FRA)': 'fr',
            'Senegal (SEN)': 'sn',
            'Iraq (IRQ)': 'iq',
            'Norway (NOR)': 'no',
            'Argentina (ARG)': 'ar',
            'Algeria (ALG)': 'dz',
            'Austria (AUT)': 'at',
            'Jordan (JOR)': 'jo',
            'Portugal (POR)': 'pt',
            'DR Congo (COD)': 'cd',
            'Uzbekistan (UZB)': 'uz',
            'Colombia (COL)': 'co',
            'England (ENG)': 'gb-eng',
            'Croatia (CRO)': 'hr',
            'Ghana (GHA)': 'gh',
            'Panama (PAN)': 'pa'
        };

        function getTeamDisplayName(teamName) {
            return teamName ? teamName.replace(/\s*\([A-Z0-9-]+\)$/, '') : '';
        }

        function getFlagAssetCode(teamName) {
            if (!teamName) return '';
            if (localFlagCodeMap[teamName]) return localFlagCodeMap[teamName];

            const match = teamName.match(/\(([A-Z0-9-]+)\)$/);
            if (!match) return '';

            const code = match[1].toLowerCase();
            const fallbackMap = {
                mex: 'mx', rsa: 'za', kor: 'kr', cze: 'cz', can: 'ca', bih: 'ba', qat: 'qa', sui: 'ch',
                bra: 'br', mar: 'ma', hai: 'ht', sco: 'gb-sct', usa: 'us', par: 'py', aus: 'au', tur: 'tr',
                ger: 'de', cuw: 'cw', civ: 'ci', ecu: 'ec', ned: 'nl', jpn: 'jp', swe: 'se', tun: 'tn',
                bel: 'be', egy: 'eg', irn: 'ir', nzl: 'nz', esp: 'es', cpv: 'cv', ksa: 'sa', uru: 'uy',
                fra: 'fr', sen: 'sn', irq: 'iq', nor: 'no', arg: 'ar', alg: 'dz', aut: 'at', jor: 'jo',
                por: 'pt', cod: 'cd', uzb: 'uz', col: 'co', eng: 'gb-eng', cro: 'hr', gha: 'gh', pan: 'pa'
            };

            return fallbackMap[code] || code;
        }

        function getFlagUrl(teamName) {
            const flagCode = getFlagAssetCode(teamName);
            return flagCode ? `flags/svg/${flagCode}.svg` : '';
        }

        function buildFlagMarkup(teamName, className = 'team-flag') {
            const flagUrl = getFlagUrl(teamName);
            if (!flagUrl) return '';
            return `<img class="${className}" src="${flagUrl}" width="16" height="12" alt="${getTeamDisplayName(teamName)} flag">`;
        }

        function updateSelectPreview(groupLetter, posKey) {
            const select = document.getElementById(`sel-${groupLetter}-${posKey}`);
            const preview = document.getElementById(`preview-${groupLetter}-${posKey}`);
            if (!select || !preview) return;

            const teamName = select.value;
            if (!teamName) {
                preview.classList.add('hidden');
                preview.innerHTML = '';
                return;
            }

            preview.classList.remove('hidden');
            preview.innerHTML = `${buildFlagMarkup(teamName)}<span class="team-name-text">${getTeamDisplayName(teamName)}</span><code>${getFlagAssetCode(teamName).toUpperCase()}</code>`;
        }

        function renderGroupStageSelectors() {
            const container = document.getElementById('groups-container');
            container.innerHTML = '';

            Object.keys(initialGroupsData).forEach(groupLetter => {
                groupSelections[groupLetter] = groupSelections[groupLetter] || { p1: '', p2: '', p3: '', p4: '' };
                const teams = initialGroupsData[groupLetter];

                const groupCard = document.createElement('div');
                groupCard.className = 'group-card';
                groupCard.id = `group-card-${groupLetter}`;
                groupCard.innerHTML = `<h3>Group ${groupLetter}</h3>`;

                // 1st, 2nd, 3rd, 4th position rows
                ['1st', '2nd', '3rd', '4th'].forEach((posName, idx) => {
                    const posKey = `p${idx+1}`;
                    const row = document.createElement('div');
                    row.className = 'row-selector';
                    row.innerHTML = `
                        <div class="pos-label ${posKey}">${posName}</div>
                        <div class="select-wrapper">
                            <select id="sel-${groupLetter}-${posKey}" onchange="handleGroupSelectChange('${groupLetter}', '${posKey}')">
                                <option value="">-- Choose Team --</option>
                                ${teams.map(team => `<option value="${team}">${team}</option>`).join('')}
                            </select>
                            <div id="preview-${groupLetter}-${posKey}" class="team-preview hidden"></div>
                        </div>
                    `;
                    if (posKey === 'p3') {
                        const thirdPlaceRow = document.createElement('div');
                        thirdPlaceRow.className = 'third-place-inline';
                        thirdPlaceRow.innerHTML = `
                            <input type="checkbox" id="promote-${groupLetter}" onchange="handleThirdPlaceCheckbox('${groupLetter}')" disabled>
                            <label for="promote-${groupLetter}">Promote to Round of 32</label>
                        `;
                        row.appendChild(thirdPlaceRow);
                    }
                    groupCard.appendChild(row);
                });

                container.appendChild(groupCard);
            });
            updateKnockoutButtonState();
        }

        function loadAppState() {
            try {
                const rawState = localStorage.getItem(appStorageKey);
                if (!rawState) return;

                const parsed = JSON.parse(rawState);
                groupSelections = parsed.groupSelections || {};
                savedThirdPlacePromotions = parsed.savedThirdPlacePromotions || {};
                bracketState = normalizeBracketState(parsed.bracketState);
                currentViewName = parsed.currentViewName || 'group';
            } catch (error) {
                groupSelections = {};
                savedThirdPlacePromotions = {};
                currentViewName = 'group';
            }
        }

        function normalizeBracketState(savedBracketState) {
            const fallback = {
                r32: Array(16).fill(null),
                r16: Array(8).fill(null),
                qf: Array(4).fill(null),
                sf: Array(2).fill(null),
                final: null,
                thirdplace: null,
                champion: null,
                thirdPlaceWinner: null
            };

            if (!savedBracketState) return fallback;

            return {
                r32: Array.isArray(savedBracketState.r32) ? savedBracketState.r32 : fallback.r32,
                r16: Array.isArray(savedBracketState.r16) ? savedBracketState.r16 : fallback.r16,
                qf: Array.isArray(savedBracketState.qf) ? savedBracketState.qf : fallback.qf,
                sf: Array.isArray(savedBracketState.sf) ? savedBracketState.sf : fallback.sf,
                final: savedBracketState.final || fallback.final,
                thirdplace: savedBracketState.thirdplace || fallback.thirdplace,
                champion: savedBracketState.champion || fallback.champion,
                thirdPlaceWinner: savedBracketState.thirdPlaceWinner || fallback.thirdPlaceWinner
            };
        }

        function saveAppState() {
            const serializableGroupSelections = {};

            Object.keys(initialGroupsData).forEach(groupLetter => {
                serializableGroupSelections[groupLetter] = groupSelections[groupLetter] || { p1: '', p2: '', p3: '', p4: '' };
            });

            const state = {
                groupSelections: serializableGroupSelections,
                savedThirdPlacePromotions,
                bracketState,
                currentViewName
            };

            localStorage.setItem(appStorageKey, JSON.stringify(state));
        }

        function restoreAppStateToUI() {
            Object.keys(initialGroupsData).forEach(groupLetter => {
                const selections = groupSelections[groupLetter] || { p1: '', p2: '', p3: '', p4: '' };

                ['p1', 'p2', 'p3', 'p4'].forEach(posKey => {
                    const select = document.getElementById(`sel-${groupLetter}-${posKey}`);
                    if (select) {
                        select.value = selections[posKey] || '';
                        updateSelectPreview(groupLetter, posKey);
                    }
                });

                const checkbox = document.getElementById(`promote-${groupLetter}`);
                const isChecked = Boolean(savedThirdPlacePromotions[groupLetter]);
                if (checkbox) {
                    checkbox.checked = isChecked && Boolean(selections.p3);
                    syncThirdPlaceCheckboxState(groupLetter);
                }
            });

            if (bracketState && bracketState.r32 && bracketState.r32.some(match => match && (match.t1 || match.t2 || match.w))) {
                document.getElementById('pill-knockout').classList.remove('disabled');
            }

            if (currentViewName === 'knockout' && document.getElementById('pill-knockout')) {
                switchView('knockout');
                renderAllBracketTiers();
            } else {
                switchView('group');
            }

            updateKnockoutButtonState();
        }

        // Clean validation ensuring choices are exclusive within each individual group
        function handleGroupSelectChange(groupLetter, changingPos) {
            const currentSelect = document.getElementById(`sel-${groupLetter}-${changingPos}`);
            const chosenValue = currentSelect.value;

            // Clear duplicates in same group card
            ['p1', 'p2', 'p3', 'p4'].forEach(pos => {
                if(pos !== changingPos) {
                    const otherSelect = document.getElementById(`sel-${groupLetter}-${pos}`);
                    if(otherSelect.value === chosenValue && chosenValue !== '') {
                        otherSelect.value = '';
                        groupSelections[groupLetter][pos] = '';
                        updateSelectPreview(groupLetter, pos);
                        if (pos === 'p3') {
                            syncThirdPlaceCheckboxState(groupLetter);
                        }
                    }
                }
            });

            groupSelections[groupLetter][changingPos] = chosenValue;
            updateSelectPreview(groupLetter, changingPos);
            syncThirdPlaceCheckboxState(groupLetter);
            invalidateDownstreamBracket();
            saveAppState();
            updateKnockoutButtonState();
        }

        function validateGroupsComplete() {
            for (let key of Object.keys(groupSelections)) {
                if (!groupSelections[key].p1 || !groupSelections[key].p2 || !groupSelections[key].p3 || !groupSelections[key].p4) {
                    return false;
                }
            }
            return true;
        }

        function switchView(viewName) {
            currentViewName = viewName;
            document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));
            document.querySelectorAll('.step-pill').forEach(pill => pill.classList.remove('active'));

            document.getElementById(`panel-${viewName}`).classList.add('active');
            document.getElementById(`pill-${viewName}`).classList.add('active');
            saveAppState();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleThirdPlaceCheckbox(groupLetter) {
            const checkbox = document.getElementById(`promote-${groupLetter}`);
            const selectedCount = getSelectedThirdPlaceGroups().length;

            if (checkbox.checked && selectedCount > 8) {
                checkbox.checked = false;
                flashGroupCard(groupLetter);
                updateKnockoutButtonState();
                return;
            }

            savedThirdPlacePromotions[groupLetter] = checkbox.checked;

            invalidateDownstreamBracket();
            saveAppState();
            updateKnockoutButtonState();
        }

        function syncThirdPlaceCheckboxState(groupLetter) {
            const checkbox = document.getElementById(`promote-${groupLetter}`);
            const isReady = Boolean(groupSelections[groupLetter].p3);
            checkbox.disabled = !isReady;
            if (!isReady) {
                checkbox.checked = false;
            }
        }

        function getSelectedThirdPlaceGroups() {
            return Object.keys(groupSelections).filter(groupLetter => {
                const checkbox = document.getElementById(`promote-${groupLetter}`);
                return checkbox && checkbox.checked;
            });
        }

        function getSelectedThirdPlaceTeams() {
            return Object.keys(groupSelections)
                .filter(groupLetter => {
                    const checkbox = document.getElementById(`promote-${groupLetter}`);
                    return checkbox && checkbox.checked;
                })
                .map(groupLetter => groupSelections[groupLetter].p3)
                .filter(Boolean);
        }

        function updateKnockoutButtonState() {
            const btn = document.getElementById('btn-to-knockouts');
            const completeGroups = validateGroupsComplete();
            const selectedCount = getSelectedThirdPlaceGroups().length;
            const ready = completeGroups && selectedCount === 8;

            btn.disabled = !ready;

            if (!completeGroups) {
                btn.innerText = 'Select all group placings first';
            } else if (selectedCount < 8) {
                btn.innerText = `Select ${8 - selectedCount} More Third-Place Teams`;
            } else if (selectedCount > 8) {
                btn.innerText = 'Too many third-place teams selected';
            } else {
                btn.innerText = 'Advance to Knockouts Bracket';
            }
        }

        function flashGroupCard(groupLetter) {
            const card = document.getElementById(`group-card-${groupLetter}`);
            if (!card) return;
            card.classList.remove('limit-flash');
            void card.offsetWidth;
            card.classList.add('limit-flash');
            window.setTimeout(() => card.classList.remove('limit-flash'), 400);
        }

        function invalidateDownstreamBracket() {
            // Hard wipe bracket structural predictions when foundational layers alter
            bracketState = { r32: Array(16).fill(null), r16: Array(8).fill(null), qf: Array(4).fill(null), sf: Array(2).fill(null), final: null, thirdplace: null, champion: null, thirdPlaceWinner: null };
            document.getElementById('champion-podium').style.display = 'none';
            document.getElementById('pill-knockout').classList.add('disabled');
            saveAppState();
        }

        // Phase 2: Structural Logic for the Round of 32 Mapping (FIFA 2026 Pathways)
        function goToKnockoutsPhase() {
            if(!validateGroupsComplete() || getSelectedThirdPlaceGroups().length !== 8) return;

            document.getElementById('pill-knockout').classList.remove('disabled');
            switchView('knockout');
            buildKnockoutR32Matches();
            renderAllBracketTiers();
            saveAppState();
        }

        function buildKnockoutR32Matches() {
            const G = groupSelections;
            const T = getSelectedThirdPlaceTeams();

            // Default safe callback mapping placeholders if arrays fall out of synch structural boundaries
            const get3rd = (idx) => T[idx] || "3rd-Place Team";

            // Precise FIFA 2026 Round of 32 bracket layouts crossover schema mapping
            bracketState.r32 = [
                { t1: G['A'].p1, t2: get3rd(0), w: null }, // Match 1
                { t1: G['B'].p2, t2: G['C'].p2, w: null }, // Match 2
                { t1: G['E'].p1, t2: G['F'].p2, w: null }, // Match 3
                { t1: G['F'].p1, t2: get3rd(1), w: null }, // Match 4
                
                { t1: G['C'].p1, t2: get3rd(2), w: null }, // Match 5
                { t1: G['D'].p2, t2: G['G'].p2, w: null }, // Match 6
                { t1: G['G'].p1, t2: get3rd(3), w: null }, // Match 7
                { t1: G['H'].p1, t2: G['I'].p2, w: null }, // Match 8

                { t1: G['B'].p1, t2: get3rd(4), w: null }, // Match 9
                { t1: G['A'].p2, t2: G['E'].p2, w: null }, // Match 10
                { t1: G['D'].p1, t2: get3rd(5), w: null }, // Match 11
                { t1: G['J'].p1, t2: G['K'].p2, w: null }, // Match 12

                { t1: G['I'].p1, t2: get3rd(6), w: null }, // Match 13
                { t1: G['K'].p1, t2: G['L'].p2, w: null }, // Match 14
                { t1: G['L'].p1, t2: get3rd(7), w: null }, // Match 15
                { t1: G['J'].p2, t2: G['H'].p2, w: null }  // Match 16
            ];

            // Re-seed upper nodes
            for(let i=0; i<8; i++) bracketState.r16[i] = { t1: null, t2: null, w: null };
            for(let i=0; i<4; i++) bracketState.qf[i]  = { t1: null, t2: null, w: null };
            for(let i=0; i<2; i++) bracketState.sf[i]  = { t1: null, t2: null, w: null };
            bracketState.final = { t1: null, t2: null, w: null };
            bracketState.thirdplace = { t1: null, t2: null, w: null };
            saveAppState();
        }

        // Dynamic multi-stage DOM Renderer orchestration
        function renderAllBracketTiers() {
            renderTier('r32-slots', bracketState.r32, 'r32');
            renderTier('r16-slots', bracketState.r16, 'r16');
            renderTier('qf-slots', bracketState.qf, 'qf');
            renderTier('sf-slots', bracketState.sf, 'sf');
            
            // Special mapping layouts for separate Final & 3rd Place Playoff boxes
            renderFinalsBox('match-final', bracketState.final, 'final');
            renderFinalsBox('match-thirdplace', bracketState.thirdplace, 'thirdplace');
        }

        function renderTier(elementId, matchArray, tierName) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';

            matchArray.forEach((match, idx) => {
                const pairBox = document.createElement('div');
                pairBox.className = 'match-pair';
                
                const t1Class = match.w && match.w === match.t1 ? 'winner' : (match.w ? 'loser' : (!match.t1 ? 'tbd' : ''));
                const t2Class = match.w && match.w === match.t2 ? 'winner' : (match.w ? 'loser' : (!match.t2 ? 'tbd' : ''));

                pairBox.innerHTML = `
                    <div class="bracket-team ${t1Class}" onclick="pickWinner('${tierName}', ${idx}, 1)">
                        ${match.t1 ? `<span class="bracket-team-content">${buildFlagMarkup(match.t1)}<span class="team-name">${getTeamDisplayName(match.t1)}</span></span>` : '<span class="team-name">TBD</span>'}
                    </div>
                    <div class="bracket-team ${t2Class}" onclick="pickWinner('${tierName}', ${idx}, 2)">
                        ${match.t2 ? `<span class="bracket-team-content">${buildFlagMarkup(match.t2)}<span class="team-name">${getTeamDisplayName(match.t2)}</span></span>` : '<span class="team-name">TBD</span>'}
                    </div>
                `;
                container.appendChild(pairBox);
            });
        }

        function renderFinalsBox(elementId, matchObj, specialType) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';
            
            const t1Class = matchObj.w && matchObj.w === matchObj.t1 ? 'winner' : (matchObj.w ? 'loser' : (!matchObj.t1 ? 'tbd' : ''));
            const t2Class = matchObj.w && matchObj.w === matchObj.t2 ? 'winner' : (matchObj.w ? 'loser' : (!matchObj.t2 ? 'tbd' : ''));

            container.innerHTML = `
                <div class="bracket-team ${t1Class}" onclick="pickWinner('${specialType}', 0, 1)">
                    ${matchObj.t1 ? `<span class="bracket-team-content">${buildFlagMarkup(matchObj.t1)}<span class="team-name">${getTeamDisplayName(matchObj.t1)}</span></span>` : '<span class="team-name">TBD</span>'}
                </div>
                <div class="bracket-team ${t2Class}" onclick="pickWinner('${specialType}', 0, 2)">
                    ${matchObj.t2 ? `<span class="bracket-team-content">${buildFlagMarkup(matchObj.t2)}<span class="team-name">${getTeamDisplayName(matchObj.t2)}</span></span>` : '<span class="team-name">TBD</span>'}
                </div>
            `;
        }

        // Reactive Bracket Tree progression state engine
        function pickWinner(tier, matchIdx, slotNumber) {
            const match = (tier === 'final' || tier === 'thirdplace') ? bracketState[tier] : bracketState[tier][matchIdx];
            
            // Do not advance empty placeholder values
            const chosenTeam = slotNumber === 1 ? match.t1 : match.t2;
            if (!chosenTeam) return;

            const losingTeam = slotNumber === 1 ? match.t2 : match.t1;

            match.w = chosenTeam;
            clearUpstreamChain(tier, matchIdx, chosenTeam, losingTeam);
            renderAllBracketTiers();
            saveAppState();
        }

        // Tracks downstream dependencies and unseats winners dynamically if nodes are altered mid-flow
        function clearUpstreamChain(tier, idx, winner, loser) {
            if (tier === 'r32') {
                const nextIdx = Math.floor(idx / 2);
                const nextSlot = (idx % 2 === 0) ? 't1' : 't2';
                resetTargetSlot('r16', nextIdx, nextSlot, winner);
            } 
            else if (tier === 'r16') {
                const nextIdx = Math.floor(idx / 2);
                const nextSlot = (idx % 2 === 0) ? 't1' : 't2';
                resetTargetSlot('qf', nextIdx, nextSlot, winner);
            } 
            else if (tier === 'qf') {
                const nextIdx = Math.floor(idx / 2);
                const nextSlot = (idx % 2 === 0) ? 't1' : 't2';
                resetTargetSlot('sf', nextIdx, nextSlot, winner);
            } 
            else if (tier === 'sf') {
                // Winner goes to Final, Loser goes to 3rd-Place Playoff
                const nextSlot = (idx === 0) ? 't1' : 't2';
                resetTargetSlot('final', 0, nextSlot, winner);
                if(loser) {
                    resetTargetSlot('thirdplace', 0, nextSlot, loser);
                }
            } 
            else if (tier === 'final') {
                bracketState.champion = winner;
                document.getElementById('champion-display').innerText = winner;
                document.getElementById('champion-podium').style.display = 'block';
                triggerConfetti();
                saveAppState();
            }
            else if (tier === 'thirdplace') {
                bracketState.thirdPlaceWinner = winner;
                saveAppState();
            }
        }

        function resetTargetSlot(targetTier, idx, slot, incomingTeam) {
            const node = (targetTier === 'final' || targetTier === 'thirdplace') ? bracketState[targetTier] : bracketState[targetTier][idx];
            
            if (node[slot] !== incomingTeam) {
                // If there's an existing team being overwritten, wipe its descendants
                const oldTeam = node[slot];
                node[slot] = incomingTeam;
                if (node.w === oldTeam || node.w === null) {
                    node.w = null;
                    clearUpstreamChain(targetTier, idx, null, null);
                }
            }
        }

        // Particle System: Canvas Confetti
        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.style.display = 'block';
            
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;
            
            const colors = ['#00ff87', '#00d2ff', '#7928ca', '#ffd700', '#ff007f'];
            const particles = [];

            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height - height,
                    r: Math.random() * 6 + 4,
                    d: Math.random() * height,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10 - 5,
                    tiltAngleIncremental: Math.random() * 0.07 + 0.02,
                    tiltAngle: 0
                });
            }

            let animationFrameId;
            function draw() {
                ctx.clearRect(0, 0, width, height);
                let processing = false;

                particles.forEach((p, idx) => {
                    p.tiltAngle += p.tiltAngleIncremental;
                    p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
                    p.x += Math.sin(p.tiltAngle);
                    p.tilt = Math.sin(p.tiltAngle - idx / 3) * 15;

                    if (p.y <= height) {
                        processing = true;
                    }

                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                    ctx.stroke();

                    // Loop recovery
                    if (p.y > height) {
                        p.x = Math.random() * width;
                        p.y = -20;
                    }
                });

                if (processing) {
                    animationFrameId = requestAnimationFrame(draw);
                }
            }

            draw();

            // Stop confetti cycle smoothly after 6 seconds
            setTimeout(() => {
                cancelAnimationFrame(animationFrameId);
                ctx.clearRect(0, 0, width, height);
                canvas.style.display = 'none';
            }, 6000);
        }
    </script>
</body>
